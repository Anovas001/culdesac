services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  app:
    image: culdesac-development
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    command: npm run dev

volumes:
  app_node_modules:
  app_next:
